<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B1120" />
<title>Absen WFH — Pussenif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0b1a11;          /* Hijau gelap pekat untuk latar belakang utama */
  --panel: #13271d;       /* Hijau tua gelap untuk kartu/panel utama */
  --panel-2: #1b3527;     /* Hijau tua sedikit lebih terang untuk input/elemen */
  --line: #2d4a3b;        /* Garis pembatas/border yang pas */
  --text: #f8f9fa;        /* Putih tulang untuk teks */
  --muted: #8891A8;       /* Abu-abu teks sekunder */
  --gold: #D4A73C;        /* Emas khas TNI */
  --gold-dim: #8a7431;    /* Emas pudar untuk focus */
  --green: #4CAF7D;       /* Hijau status OK */
  --red: #E2554D;         /* Merah status error */
}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body{ overflow-x:hidden; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(900px 400px at 50% -20%, #172038 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px 60px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    position:relative;
    overflow:hidden;
    margin:0 auto;
    display: none; /* Sembunyikan form utama saat awal, akan dibuka lewat tombol intro */
  }

  .card-top{ padding:22px 22px 16px; }
  .eyebrow{ display:flex; align-items:center; justify-content:space-between; }
  .mark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:12px;
    color:var(--gold);
    letter-spacing:2px;
    text-transform:uppercase;
    border:1px solid var(--gold-dim);
    padding:3px 8px;
    border-radius:3px;
  }
  #dayBadge{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:3px 8px;
    border-radius:999px;
    background:var(--panel-2);
    color:var(--muted);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    margin:12px 0 2px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:10px;
  }
  .brand-logo{
    width:52px;
    height:auto;
    flex:none;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  .brand-row h1{ margin:0 0 2px; }
  .brand-row .sub{ margin:0; }
  .sub{ color:var(--muted); font-size:13px; margin:0; }

  .photo-zone{ padding:0 22px; }
  video, canvas, img.preview{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:12px;
    margin-top:14px;
    background:#000;
    display:block;
    border:1px solid var(--line);
  }
  canvas, img.preview{ display:none; }

  /* --- garis perforasi ala tiket --- */
  .perforation{
    position:relative;
    height:1px;
    margin:20px 0;
    border-top:2px dashed #2c3652;
  }
  .perforation::before, .perforation::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--bg);
    box-shadow: 0 0 0 1px var(--line) inset;
  }
  .perforation::before{ left:-10px; }
  .perforation::after{ right:-10px; }

  .fields{ padding:0 22px; }
  label{
    display:block;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:6px;
    margin-top:14px;
  }
  select, input[type=text]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 12px;
    border-radius:8px;
    font-size:16px;
    font-family:'Inter', sans-serif;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238891A8' stroke-width='1.6' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:34px;
  }
  select:focus, input[type=text]:focus{ outline:1.5px solid var(--gold-dim); }

  .row{
    display:flex;
    gap:8px;
    margin-top:14px;
    padding:0 22px;
  }
  button{
    flex:1;
    padding:13px 12px;
    min-height:46px;
    border:none;
    border-radius:99px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .btn-primary{ background:var(--gold); color:#1a1305; }
  .btn-secondary{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); }
  button:hover{ filter:brightness(1.07); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  .status{
    margin:14px 22px 22px;
    font-size:12.5px;
    min-height:16px;
    line-height:1.5;
  }
  .status.ok{ color:var(--green); }
  .status.err{ color:var(--red); }

  /* --- stempel verifikasi --- */
  .stamp{
    position:absolute;
    top:56px; right:30px;
    width:70px; height:70px;
    border:2.5px solid var(--green);
    border-radius:50%;
    color:var(--green);
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:9.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    transform:rotate(-14deg);
    line-height:1.2;
    background:rgba(76,175,125,0.06);
    z-index:2;
  }

  .loc-badge{
    margin:14px 22px 0;
    padding:10px 12px;
    border-radius:9px;
    background:var(--panel-2);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted);
  }
  .loc-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--muted);
    flex:none;
  }
  .loc-badge.ok{ border-color:rgba(76,175,125,0.4); color:var(--green); }
  .loc-badge.ok .loc-dot{ background:var(--green); }
  .loc-badge.err{ border-color:rgba(226,85,77,0.4); color:var(--red); }
  .loc-badge.err .loc-dot{ background:var(--red); }
  .loc-badge.loading .loc-dot{
    background:var(--gold);
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .loc-badge #btnRetryLoc{
    margin-left:auto;
    flex:none;
    width:auto;
    min-height:auto;
    padding:5px 10px;
    font-size:11.5px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    margin-top:16px;
  }

  /* PERBAIKAN STYLING INTRO PAGE */
  .intro{
    width: 100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px;
    margin: 40px auto 0 auto;
    animation:fadeIn 0.4s ease;
  }
  .intro-logo{
    width:100px;
    height:auto;
    margin-bottom:18px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .intro-eyebrow{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:12px;
    color:var(--gold);
    letter-spacing:2px;
    text-transform:uppercase;
    border:1px solid var(--gold-dim);
    padding:4px 10px;
    border-radius:3px;
    margin-bottom:14px;
  }
  .intro-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    margin:0 0 12px;
  }
  .intro-sub{
    color:var(--muted);
    font-size:14px;
    max-width:320px;
    line-height:1.6;
    margin:0 0 28px;
  }
  .intro-btn{
    width: 100%;
    max-width: 280px;
    height: 48px;
    min-height: 48px;
    background:var(--gold);
    color:#1a1305;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .intro-btn:hover{ filter:brightness(1.07); }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  @media (max-width:380px){
    .card-top, .photo-zone, .fields, .row{ padding-left:16px; padding-right:16px; }
    h1{ font-size:19px; }
  }
</style>
</head>
<body>

<!-- Halaman Intro -->
<div class="intro" id="intro">
  <!-- Placeholder logo Pussenif / TNI AD -->
  <svg class="intro-logo" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
  </svg>
  <div class="intro-eyebrow">Pussenif TNI AD</div>
  <h2 class="intro-title">Absensi WFH</h2>
  <p class="intro-sub">Sistem verifikasi kehadiran kerja dari rumah terintegrasi dengan validasi lokasi dan swafoto.</p>
  <button class="intro-btn" id="btnStart">Mulai Absen</button>
</div>

<!-- Kartu Absen Utama -->
<div class="card" id="mainCard">
  <div class="stamp" id="stamp">HADIR<br>WFH</div>
  <div class="card-top">
    <div class="eyebrow">
      <span class="mark">PUSSENIF</span>
      <span id="dayBadge">Memuat...</span>
    </div>
    <div class="brand-row">
      <div>
        <h1>Absen WFH</h1>
        <p class="sub">Pusat Kesenjataan Infanteri</p>
      </div>
    </div>
  </div>

  <div class="loc-badge loading" id="locBadge">
    <div class="loc-dot"></div>
    <span id="locText">Mendeteksi lokasi Anda...</span>
    <button id="btnRetryLoc" style="display:none;">Ulangi</button>
  </div>

  <div class="photo-zone">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="preview" class="preview" alt="Pratinjau Foto" />
  </div>

  <div class="row" style="margin-top:14px;">
    <button type="button" class="btn-secondary" id="btnSnap">Ambil Foto</button>
    <button type="button" class="btn-secondary" id="btnRetake" style="display:none;">Ulangi Foto</button>
  </div>

  <div class="perforation"></div>

  <div class="fields">
    <label for="nama">Nama Lengkap & Pangkat</label>
    <input type="text" id="nama" placeholder="Contoh: Serda Budi Santoso" autocomplete="name" />

    <label for="ket">Keterangan Kehadiran</label>
    <select id="ket">
      <option value="Hadir WFH">Hadir (Bekerja dari Rumah)</option>
      <option value="Dinas Luar">Dinas Luar / Tugas Khusus</option>
      <option value="Izin / Sakit">Izin / Sakit</option>
    </select>
  </div>

  <div class="row" style="margin-bottom:8px;">
    <button type="button" class="btn-primary" id="btnSubmit" disabled>Kirim Absensi</button>
  </div>

  <div class="status" id="statusMsg"></div>
</div>

<script>
  // Script interaktif fungsional untuk kamera, geolokasi, dan transisi halaman
  const intro = document.getElementById('intro');
  const mainCard = document.getElementById('mainCard');
  const btnStart = document.getElementById('btnStart');
  
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const btnSnap = document.getElementById('btnSnap');
  const btnRetake = document.getElementById('btnRetake');
  const btnSubmit = document.getElementById('btnSubmit');
  const statusMsg = document.getElementById('statusMsg');
  const stamp = document.getElementById('stamp');
  const dayBadge = document.getElementById('dayBadge');
  
  const locBadge = document.getElementById('locBadge');
  const locText = document.getElementById('locText');
  const btnRetryLoc = document.getElementById('btnRetryLoc');
  const namaInput = document.getElementById('nama');

  let streamObj = null;
  let photoCaptured = false;
  let locValid = false;

  // Tanggal & Hari
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const now = new Date();
  dayBadge.textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

  // Transisi dari Intro ke Card Utama
  btnStart.addEventListener('click', async () => {
    intro.style.display = 'none';
    mainCard.style.display = 'block';
    await initCamera();
    initLocation();
  });

  // Inisialisasi Kamera (Kamera Depan)
  async function initCamera() {
    try {
      streamObj = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } },
        audio: false
      });
      video.srcObject = streamObj;
    } catch (err) {
      statusMsg.className = 'status err';
      statusMsg.textContent = 'Gagal mengakses kamera. Izinkan akses kamera pada peramban Anda.';
    }
  }

  // Ambil Foto (Snap)
  btnSnap.addEventListener('click', () => {
    if (!streamObj) return;
    const width = video.videoWidth || 640;
    const height = video.videoHeight || 480;
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, width, height);
    
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    preview.src = dataUrl;
    preview.style.display = 'block';
    video.style.display = 'none';

    // Matikan stream kamera setelah foto diambil untuk hemat sumber daya
    streamObj.getTracks().forEach(track => track.stop());

    btnSnap.style.display = 'none';
    btnRetake.style.display = 'block';
    photoCaptured = true;
    checkFormReady();
  });

  // Ulangi Foto (Retake)
  btnRetake.addEventListener('click', async () => {
    preview.style.display = 'none';
    video.style.display = 'block';
    btnRetake.style.display = 'none';
    btnSnap.style.display = 'block';
    photoCaptured = false;
    checkFormReady();
    await initCamera();
  });

  // Cek Geolokasi
  function initLocation() {
    if (!navigator.geolocation) {
      setLocStatus('err', 'Geolokasi tidak didukung oleh peramban ini.');
      return;
    }
    setLocStatus('loading', 'Mendeteksi posisi koordinat Anda...');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(5);
        const lng = pos.coords.longitude.toFixed(5);
        setLocStatus('ok', `Lokasi terverifikasi (${lat}, ${lng})`);
        locValid = true;
        checkFormReady();
      },
      (err) => {
        setLocStatus('err', 'Gagal mendeteksi lokasi. Pastikan GPS aktif.');
        btnRetryLoc.style.display = 'inline-block';
        locValid = false;
        checkFormReady();
      },
      { timeout: 10000, enableHighAccuracy: true }
    );
  }

  btnRetryLoc.addEventListener('click', () => {
    btnRetryLoc.style.display = 'none';
    initLocation();
  });

  function setLocStatus(type, text) {
    locBadge.className = `loc-badge ${type}`;
    locText.textContent = text;
  }

  // Validasi kesiapan form pengiriman
  namaInput.addEventListener('input', checkFormReady);

  function checkFormReady() {
    if (photoCaptured && locValid && namaInput.value.trim().length > 2) {
      btnSubmit.disabled = false;
    } else {
      btnSubmit.disabled = true;
    }
  }

  // Simulasi Kirim Absen
  btnSubmit.addEventListener('click', () => {
    btnSubmit.disabled = true;
    namaInput.disabled = true;
    document.getElementById('ket').disabled = true;
    btnRetake.disabled = true;
    
    statusMsg.className = 'status ok';
    statusMsg.textContent = 'Menyimpan data absensi ke server Pussenif...';

    setTimeout(() => {
      statusMsg.textContent = 'Absensi WFH berhasil dikirim dan tercatat!';
      stamp.style.display = 'flex';
    }, 1500);
  });
</script>
</body>
</html>
