<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registri Absen — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1a11;
      --panel: #13271d;
      --panel-2: #1b3527;
      --line: #2d4a3b;
      --text: #f8f9fa;
      --muted: #8891A8;
      --gold: #D4A73C;
      --gold-dim: #8a7431;
      --green: #4CAF7D;
      --red: #E2554D;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(1200px 500px at 10% -10%, #172038 0%, transparent 60%), var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-y: scroll;
    }

    header {
      padding: 32px 40px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 56px;
      height: auto;
      flex: none;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.4));
    }

    .brand .mark {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid var(--gold-dim);
      padding: 3px 9px;
      border-radius: 3px;
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 24px;
      margin: 0;
      letter-spacing: 0.2px;
    }

    header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      padding: 24px 40px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .stat .num {
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-weight: 600;
      color: var(--gold);
      line-height: 1;
    }

    .stat .lbl {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    input,
    button,
    select {
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
    }

    input[type=password],
    input[type=text],
    input[type=date],
    select {
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
    }

    input[type=password] {
      width: 180px;
    }

    input[type=text] {
      width: 200px;
    }

    button {
      background: var(--gold);
      color: #1a1305;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 500;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .spacer {
      flex: 1;
    }

    .status {
      font-size: 12.5px;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: var(--panel-2);
    }

    tr:hover td {
      background: #151d33;
    }

    .who {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .thumb-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      flex: none;
    }

    img.thumb {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      display: block;
    }

    .stamp {
      position: absolute;
      top: -8px;
      right: -10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 2px solid var(--panel);
    }

    .nama {
      font-weight: 600;
    }

    .waktu {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      color: var(--muted);
    }

    a.maplink {
      color: var(--gold);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
    }

    a.maplink:hover {
      text-decoration: underline;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
    }

    .pagination .info {
      color: var(--muted);
      font-size: 12.5px;
      margin-right: auto;
    }

    .empty {
      color: var(--muted);
      padding: 50px 0;
      text-align: center;
      font-size: 14px;
    }

    .locked {
      padding: 60px 20px;
      text-align: center;
    }

    .locked .mark-lg {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* ---- Toast notifications ---- */
    #toastContainer {
      position: fixed;
      top: 18px;
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      width: 100%;
      max-width: 340px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transform: translateX(24px);
      opacity: 0;
      animation: toastIn 0.25s ease forwards;
    }

    .toast.hide {
      animation: toastOut 0.25s ease forwards;
    }

    .toast .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none;
    }

    .toast.ok .dot { background: var(--green); }
    .toast.err .dot { background: var(--red); }
    .toast.info .dot { background: var(--gold); }

    @keyframes toastIn {
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes toastOut {
      to { transform: translateX(24px); opacity: 0; }
    }

    /* ---- Statistik & grafik ringkas ---- */
    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 22px;
    }

    .chart-panel .chart-title {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    #weeklyChart {
      width: 100%;
      height: 120px;
      display: block;
    }

    /* ---- Catatan & lampiran ---- */
    .catatan-cell {
      max-width: 200px;
      font-size: 12px;
      color: var(--muted);
      white-space: normal;
    }

    a.lampiranlink {
      color: var(--gold);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
    }

    a.lampiranlink:hover {
      text-decoration: underline;
    }

    .badge-status {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid;
    }

    .badge-hadir {
      color: var(--green);
      border-color: rgba(76, 175, 125, 0.4);
      background: rgba(76, 175, 125, 0.12);
    }

    .badge-izin, .badge-sakit {
      color: #E2A83D;
      border-color: rgba(226, 168, 61, 0.4);
      background: rgba(226, 168, 61, 0.12);
    }
  </style>
</head>
<body>

  <div id="toastContainer"></div>

  <header>
    <div class="brand">
      <div class="mark">TNI</div>
      <div>
        <h1>Registri Absen</h1>
        <p>Dashboard Monitoring Kehadiran</p>
      </div>
    </div>
  </header>

  <main>
    <section class="stats">
      <div class="stat">
        <div class="num">0</div>
        <div class="lbl">Hadir</div>
      </div>
      <div class="stat">
        <div class="num">0</div>
        <div class="lbl">Izin</div>
      </div>
      <div class="stat">
        <div class="num">0</div>
        <div class="lbl">Sakit</div>
      </div>
      <div class="stat">
        <div class="num">0</div>
        <div class="lbl">Total</div>
      </div>
    </section>

    <div class="panel">
      <div class="toolbar">
        <input type="text" placeholder="Cari nama..." />
        <input type="date" />
        <button class="ghost">Filter</button>
        <div class="spacer"></div>
        <div class="status">Menampilkan data terbaru</div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Pegawai / Anggota</th>
              <th>Waktu</th>
              <th>Status</th>
              <th>Catatan</th>
              <th>Lokasi / Peta</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="5" class="empty">Belum ada data absensi yang tercatat.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <div class="info">Halaman 1 dari 1</div>
        <button class="ghost" disabled>Sebelumnya</button>
        <button class="ghost" disabled>Selanjutnya</button>
      </div>
    </div>
  </main>

</body>
</html>
