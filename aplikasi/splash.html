<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memuat...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 320px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .card {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      border-radius: 20px;
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 25px 60px rgba(0,0,0,0.8),
        0 0 80px rgba(59, 130, 246, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg at 50% 50%,
        transparent 0deg,
        rgba(59, 130, 246, 0.05) 60deg,
        transparent 120deg
      );
      animation: rotate 8s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .logo-wrap {
      position: relative;
      z-index: 1;
    }

    .logo-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
      position: relative;
    }

    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #1d4ed8, #60a5fa);
      z-index: -1;
      animation: spin-border 3s linear infinite;
    }

    @keyframes spin-border {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .logo-icon {
      font-size: 32px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .text-section {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .app-sub {
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(59,130,246,0.4), transparent);
      position: relative;
      z-index: 1;
    }

    .loading-section {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .loading-bar-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #1d4ed8, #60a5fa, #1d4ed8);
      background-size: 200% 100%;
      border-radius: 99px;
      animation: loading 1.8s ease-in-out infinite;
    }

    @keyframes loading {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    .loading-text {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.3px;
    }

    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-ring">
        <span class="logo-icon">🏛️</span>
      </div>
    </div>

    <div class="text-section">
      <div class="app-name">Dashboard Absen WFH</div>
      <div class="app-sub">PUSSENIF — Pusat Kesenjataan Infanteri</div>
    </div>

    <div class="divider"></div>

    <div class="loading-section">
      <div class="loading-bar-wrap">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-text">Menginisialisasi server, harap tunggu…</div>
    </div>

    <div class="version">v1.0.0</div>
  </div>
</body>
</html>
